<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Reflection - Tấm Gương Tự Phản Tỉnh Biểu Tượng</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-body: 'Be Vietnam Pro', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-serif: 'Lora', 'Playfair Display', Georgia, serif;
            --app-bg: #070a13;
            --app-text: #f8fafc;
            --surface-primary: #0f1424;
            --surface-secondary: #151b30;
            --border-subtle: rgba(212, 175, 55, 0.15);
            --gold-accent: #e5be65;
            --gold-muted: #bda255;
        }

        /* Light Mode: Warm Textured Paper & Rich Editorial Ink */
        [data-theme="light"], .light-theme {
            --app-bg: #faf7f2;
            --app-text: #1a202c;
            --surface-primary: #ffffff;
            --surface-secondary: #f4efe6;
            --border-subtle: #e5ded3;
            --gold-accent: #a87e22;
            --gold-muted: #8c6919;
        }
        
        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--app-bg);
            color: var(--app-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .font-serif {
            font-family: var(--font-serif);
            font-feature-settings: "kern" 1, "liga" 1;
        }

        /* Light Theme Overrides */
        [data-theme="light"] body,
        .light-theme {
            background-color: #faf7f2 !important;
            color: #1a202c !important;
        }

        [data-theme="light"] .bg-slate-950,
        .light-theme .bg-slate-950 {
            background-color: #faf7f2 !important;
        }

        [data-theme="light"] .bg-slate-900,
        .light-theme .bg-slate-900 {
            background-color: #ffffff !important;
            border-color: #eae3d6 !important;
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.05);
        }

        [data-theme="light"] .bg-slate-900\/90,
        [data-theme="light"] .bg-slate-900\/80,
        [data-theme="light"] .bg-slate-900\/60,
        .light-theme .bg-slate-900\/90,
        .light-theme .bg-slate-900\/80,
        .light-theme .bg-slate-900\/60 {
            background-color: rgba(255, 255, 255, 0.95) !important;
            border-color: #eae3d6 !important;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
        }

        [data-theme="light"] .bg-slate-950\/60,
        [data-theme="light"] .bg-slate-950\/80,
        [data-theme="light"] .bg-slate-950\/95,
        .light-theme .bg-slate-950\/60,
        .light-theme .bg-slate-950\/80,
        .light-theme .bg-slate-950\/95 {
            background-color: #f5f0e6 !important;
            border-color: #eae3d6 !important;
        }

        [data-theme="light"] .text-amber-100,
        [data-theme="light"] .text-amber-200,
        .light-theme .text-amber-100,
        .light-theme .text-amber-200 {
            color: #1a202c !important;
        }

        [data-theme="light"] .text-slate-100,
        [data-theme="light"] .text-slate-200,
        [data-theme="light"] .text-slate-300,
        .light-theme .text-slate-100,
        .light-theme .text-slate-200,
        .light-theme .text-slate-300 {
            color: #2d3748 !important;
        }

        [data-theme="light"] .text-slate-400,
        .light-theme .text-slate-400 {
            color: #596780 !important;
        }

        [data-theme="light"] .text-slate-500,
        .light-theme .text-slate-500 {
            color: #8c9ba5 !important;
        }

        [data-theme="light"] .border-slate-800,
        [data-theme="light"] .border-slate-850,
        [data-theme="light"] .border-slate-900,
        .light-theme .border-slate-800,
        .light-theme .border-slate-850,
        .light-theme .border-slate-900 {
            border-color: #e5ded2 !important;
        }

        [data-theme="light"] .border-amber-400\/20,
        [data-theme="light"] .border-amber-400\/30,
        [data-theme="light"] .border-amber-500\/20,
        [data-theme="light"] .border-amber-500\/30,
        .light-theme .border-amber-400\/20,
        .light-theme .border-amber-400\/30,
        .light-theme .border-amber-500\/20,
        .light-theme .border-amber-500\/30 {
            border-color: rgba(168, 126, 34, 0.35) !important;
        }

        [data-theme="light"] .bg-amber-400\/10,
        [data-theme="light"] .bg-amber-500\/10,
        .light-theme .bg-amber-400\/10,
        .light-theme .bg-amber-500\/10 {
            background-color: rgba(168, 126, 34, 0.1) !important;
        }

        [data-theme="light"] .text-amber-300,
        [data-theme="light"] .text-amber-400,
        .light-theme .text-amber-300,
        .light-theme .text-amber-400 {
            color: #936b15 !important;
        }

        [data-theme="light"] input,
        [data-theme="light"] textarea,
        .light-theme input,
        .light-theme textarea {
            background-color: #ffffff !important;
            color: #1a202c !important;
            border-color: #dcd3c5 !important;
        }

        /* Ambient Celestial Stardust */
        .bg-grain {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(229, 190, 101, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        [data-theme="light"] .bg-grain {
            background-image: radial-gradient(rgba(100, 116, 139, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 20, 36, 0.5);
        }
        [data-theme="light"] ::-webkit-scrollbar-track {
            background: #f0eae1;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.25);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.45);
        }

        /* 3D Perspective */
        .perspective {
            perspective: 1200px;
        }
    </style>
</head>
<body class="selection:bg-amber-400/30 selection:text-amber-200">
    <div class="bg-grain" aria-hidden="true"></div>
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
